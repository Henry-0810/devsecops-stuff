name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# This group differs from Release, including when called by that workflow.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python and dependency cache
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install locked dependencies
        run: make install
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check lint and formatting
        run: make lint
      - name: Validate Python and template compilation
        run: make build

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python and dependency cache
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install locked dependencies
        run: make install
      - name: Run unit and API tests
        run: make test

  # FUTURE SOURCE CHECKS: add SAST, SCA, and secret-scanning jobs here.
  # Add those job IDs to build.needs and ci-result.needs when implemented.
  build:
    name: Build
    needs: [validate, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build production Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: devsecops-stuff:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
          provenance: false
          sbom: false
      - name: Smoke test Docker image
        env:
          IMAGE: devsecops-stuff:ci
        run: make docker-test

  ci-result:
    name: CI required
    if: always()
    needs: [validate, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all CI stages to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
